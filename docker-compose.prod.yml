services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prepport
      POSTGRES_USER: prepport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prepport-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepport -d prepport"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prepport
      SPRING_DATASOURCE_USERNAME: prepport
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PREPPORT_CORS_ORIGINS: ${PREPPORT_CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  prepport-postgres-prod-data:
